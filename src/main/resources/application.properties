server.port=8081
services.usuario.url=http://localhost:8080

spring.application.name=agendador-tarefas

spring.data.mongodb.uri=mongodb://localhost:27017/agendador_tarefas_db

spring.cloud.openfeign.circuitbreaker.enabled=true

jwt.secret=SuaChaveSecretaMuitoLonga1234567890ABCDEFGHIJ

logging.level.org.springframework.security=DEBUG
logging.level.com.agendador_tarefas.security=DEBUG

resilience4j.circuitbreaker.instances.usuario-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.usuario-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.usuario-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.usuario-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.usuario-service.automatic-transition-from-open-to-half-open-enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always